name: CI Build, Publish & Release Assets

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  release:
    types: [ published, created ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        registry-url: 'https://npm.pkg.github.com'
        scope: '@kudoby'

    - name: Install Dependencies
      run: npm install

    - name: Run TypeScript Compile
      run: npm run build

    - name: Pack Distribution Tarball & Zip
      run: |
        VERSION=$(node -p "require('./package.json').version")
        npm pack
        mkdir -p release-assets
        mv *.tgz release-assets/
        zip -r "release-assets/kudoby-deck-sdk-v${VERSION}-standalone.zip" dist bin templates README.md LICENSE package.json

    - name: Publish to GitHub Packages
      run: |
        npm config set //npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}
        # GitHub Packages requires the scope to match the owner repository (@kudoby)
        node -e '
          const pkg = require("./package.json");
          pkg.name = "@kudoby/kudoby-deck-sdk";
          pkg.publishConfig = { registry: "https://npm.pkg.github.com" };
          require("fs").writeFileSync("./package.json", JSON.stringify(pkg, null, 2));
        '
        npm publish || true
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Release Binaries if Tagged or Released
      if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: release-assets/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
